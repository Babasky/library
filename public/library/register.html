<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Bibliotech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
       
    </style>
</head>

<body class="font-sans bg-gray-50">
    <div class="min-h-screen flex items-center justify-center register-gradient">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <a href="index.html" class="flex items-center justify-center">
                    <i data-feather="book" class="text-indigo-600 mr-2"></i>
                    <span class="text-2xl font-bold text-gray-900">Bibliotech</span>
                </a>
                <h1 class="text-2xl font-bold text-gray-900 mt-4">Inscription</h1>
                <p class="text-gray-600">Créez votre compte gratuitement</p>
            </div>

            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="firstname" class="block text-sm font-medium text-gray-700 mb-1">Prénom</label>
                        <input type="text" id="firstname"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label for="lastname" class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                        <input type="text" id="lastname"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot
                        de passe</label>
                    <input type="password" id="confirm-password" placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="terms"
                        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="terms" class="ml-2 block text-sm text-gray-700">
                        J'accepte les <a href="#" class="text-indigo-600 hover:text-indigo-800">conditions
                            d'utilisation</a>
                    </label>
                </div>

                <div>
                    <button type="submit"
                        class="w-full px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition flex items-center justify-center">
                        <i data-feather="user-plus" class="mr-2"></i>
                        S'inscrire
                    </button>
                </div>

                <div class="text-center text-sm text-gray-600">
                    Vous avez déjà un compte ? <a href="login.html" class="text-indigo-600 hover:text-indigo-800">Se
                        connecter</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        feather.replace();
    </script>
</body>

</html>
