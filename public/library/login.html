<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Bibliotech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .login-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
    </style>
</head>

<body class="font-sans bg-gray-50">
    <div class="min-h-screen flex items-center justify-center login-gradient">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <a href="index.html" class="flex items-center justify-center">
                    <i data-feather="book" class="text-indigo-600 mr-2"></i>
                    <span class="text-2xl font-bold text-gray-900">Bibliotech</span>
                </a>
                <h1 class="text-2xl font-bold text-gray-900 mt-4">Connexion</h1>
                <p class="text-gray-600">Accédez à votre compte</p>
            </div>

            <form class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-sm text-indigo-600 hover:text-indigo-800">Mot de passe oublié ?</a>
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition flex items-center justify-center">
                        <i data-feather="log-in" class="mr-2"></i>
                        Se connecter
                    </button>
                </div>

                <div class="text-center text-sm text-gray-600">
                    Vous n'avez pas de compte ? <a href="register.html"
                        class="text-indigo-600 hover:text-indigo-800">S'inscrire</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        feather.replace();
    </script>
</body>

</html>
