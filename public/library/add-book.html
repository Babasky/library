<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Livre - Bibliotech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="font-sans bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="sidebar hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64 border-r border-gray-200 bg-white">
                <div class="flex items-center h-16 px-6 border-b border-gray-200">
                    <a href="index.html" class="flex items-center">
                        <i data-feather="book" class="text-indigo-600 mr-2"></i>
                        <span class="text-xl font-bold text-gray-900">Bibliotech</span>
                    </a>
                </div>
                <div class="flex flex-col flex-grow overflow-y-auto">
                    <div class="px-6 py-4">
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Administration</p>
                    </div>
                    <nav class="flex-1 px-2 space-y-1">
                        <a href="admin.html"
                            class="sidebar-item flex items-center px-4 py-3 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-md">
                            <i data-feather="home" class="mr-3"></i>
                            Tableau de bord
                        </a>
                        <a href="book-management.html"
                            class="sidebar-item active flex items-center px-4 py-3 text-sm font-medium text-gray-900 rounded-md">
                            <i data-feather="book" class="mr-3 text-indigo-600"></i>
                            Gestion des livres
                        </a>
                        <a href="user-management.html"
                            class="sidebar-item flex items-center px-4 py-3 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-md">
                            <i data-feather="users" class="mr-3"></i>
                            Gestion des utilisateurs
                        </a>
                        <a href="loan-management.html"
                            class="sidebar-item flex items-center px-4 py-3 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-md">
                            <i data-feather="clock" class="mr-3"></i>
                            Gestion des emprunts
                        </a>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex flex-col flex-1 overflow-hidden">
            <!-- Top Navigation -->
            <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200 bg-white">
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-button" class="text-gray-500 hover:text-gray-900">
                        <i data-feather="menu"></i>
                    </button>
                </div>
                <div class="flex-1 flex justify-between items-center">
                    <h1 class="text-lg font-semibold text-gray-900">Ajouter un livre</h1>
                    <div class="flex items-center space-x-4">
                        <a href="book-management.html"
                            class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition">
                            Annuler
                        </a>
                        <div class="relative">
                            <button class="flex items-center space-x-2">
                                <img class="w-8 h-8 rounded-full" src="http://static.photos/people/200x200/3"
                                    alt="Admin">
                                <span class="hidden md:inline text-sm font-medium">Admin</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
                <div class="max-w-3xl mx-auto">
                    <div class="bg-white p-8 rounded-lg shadow-sm">
                        <form>
                            <div class="grid grid-cols-1 gap-6">
                                <div>
                                    <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Titre du
                                        livre</label>
                                    <input type="text" id="title"
                                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                </div>

                                <div>
                                    <label for="author"
                                        class="block text-sm font-medium text-gray-700 mb-1">Auteur</label>
                                    <input type="text" id="author"
                                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label for="isbn"
                                            class="block text-sm font-medium text-gray-700 mb-1">ISBN</label>
                                        <input type="text" id="isbn"
                                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>

                                    <div>
                                        <label for="publisher"
                                            class="block text-sm font-medium text-gray-700 mb-1">Éditeur</label>
                                        <input type="text" id="publisher"
                                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div>
                                        <label for="year" class="block text-sm font-medium text-gray-700 mb-1">Année de
                                            publication</label>
                                        <input type="number" id="year"
                                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>

                                    <div>
                                        <label for="pages" class="block text-sm font-medium text-gray-700 mb-1">Nombre
                                            de pages</label>
                                        <input type="number" id="pages"
                                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                    </div>

                                    <div>
                                        <label for="category"
                                            class="block text-sm font-medium text-gray-700 mb-1">Catégorie</label>
                                        <select id="category"
                                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                                            <option value="roman">Roman</option>
                                            <option value="science-fiction">Science-fiction</option>
                                            <option value="biographie">Biographie</option>
                                            <option value="histoire">Histoire</option>
                                            <option value="poesie">Poésie</option>
                                            <option value="theatre">Théâtre</option>
                                            <option value="essai">Essai</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label for="description"
                                        class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                                    <textarea id="description" rows="4"
                                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                                </div>

                                <div>
                                    <label for="cover" class="block text-sm font-medium text-gray-700 mb-1">Couverture
                                        du livre</label>
                                    <div
                                        class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                                        <div class="space-y-1 text-center">
                                            <div class="flex text-sm text-gray-600">
                                                <label for="file-upload"
                                                    class="relative cursor-pointer bg-white rounded-md font-medium text-indigo-600 hover:text-indigo-500 focus-within:outline-none">
                                                    <span>Télécharger une image</span>
                                                    <input id="file-upload" name="file-upload" type="file"
                                                        class="sr-only">
                                                </label>
                                                <p class="pl-1">ou glisser-déposer</p>
                                            </div>
                                            <p class="text-xs text-gray-500">PNG, JPG, GIF jusqu'à 10MB</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex justify-end">
                                    <button type="submit"
                                        class="px-6 py-3 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">
                                        Enregistrer le livre
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script>
        feather.replace();

        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function () {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>

</html>
